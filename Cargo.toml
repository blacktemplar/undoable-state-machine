[package]
name = "undoable-state-machine"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A generic, undoable state machine backed by an append-only log, where undo is just another log entry."
repository = "https://github.com/blacktemplar/undoable-state-machine"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["state-machine", "undo", "redo", "log"]
categories = ["data-structures", "algorithms"]

[package.metadata.docs.rs]
all-features = true

[features]
# Implements `serde::Serialize`/`Deserialize` for the log types and
# `StateMachine`, so a log can be persisted and restored.
serde = ["dep:serde", "uuid/serde"]

[dependencies]
serde = { version = "1", optional = true, features = ["derive"] }
uuid = { version = "1.26.1", features = ["v4", "fast-rng"] }

[dev-dependencies]
proptest = "1"
serde_json = "1"
